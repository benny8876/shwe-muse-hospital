services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shwemuse
      POSTGRES_PASSWORD: shwemuse
      POSTGRES_DB: shwemuse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shwemuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://shwemuse:shwemuse@db:5432/shwemuse
      SECRET_KEY: change-me-in-production-shwe-muse
      SEED_ON_START: "true"
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
